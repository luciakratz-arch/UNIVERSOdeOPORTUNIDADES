<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B"/>
      <stop offset="60%" style="stop-color:#2E6DB4"/>
      <stop offset="100%" style="stop-color:#1B3A6B"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>

  <!-- Fundo principal -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Elementos decorativos de fundo -->
  <circle cx="1050" cy="120" r="200" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1100" cy="500" r="150" fill="rgba(255,255,255,0.03)"/>
  <circle cx="150" cy="550" r="180" fill="rgba(255,255,255,0.03)"/>

  <!-- Faixa lateral vermelha esquerda -->
  <rect x="0" y="0" width="8" height="630" fill="#C0392B"/>

  <!-- Card central -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Logo UNIVERSO -->
  <text x="100" y="160" font-family="Arial Black, Arial" font-weight="900" font-size="68" fill="white" letter-spacing="2">UNIVERSO</text>
  <text x="100" y="192" font-family="Arial" font-weight="600" font-size="18" fill="rgba(255,255,255,0.65)" letter-spacing="2">CENTRO UNIVERSITÁRIO UNIVERSO GOIÂNIA</text>

  <!-- Linha divisória -->
  <rect x="100" y="212" width="500" height="3" fill="#C0392B" rx="2"/>

  <!-- Badge curso -->
  <rect x="100" y="234" width="290" height="36" rx="18" fill="#C0392B"/>
  <text x="145" y="257" font-family="Arial" font-weight="700" font-size="15" fill="white" letter-spacing="0.5">🎓 Curso de Administração</text>

  <!-- Título do projeto -->
  <text x="100" y="340" font-family="Arial Black, Arial" font-weight="900" font-size="72" fill="white" letter-spacing="-1">Universo de</text>
  <text x="100" y="420" font-family="Arial Black, Arial" font-weight="900" font-size="72" fill="#FFD700" letter-spacing="-1">Oportunidades</text>

  <!-- Subtítulo -->
  <text x="100" y="470" font-family="Arial" font-weight="400" font-size="24" fill="rgba(255,255,255,0.80)">Descubra seu potencial empreendedor e criativo</text>

  <!-- 3 chips de destaque -->
  <rect x="100" y="510" width="220" height="40" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="210" y="535" font-family="Arial" font-weight="600" font-size="16" fill="white" text-anchor="middle">✨ Gratuito</text>

  <rect x="336" y="510" width="260" height="40" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="466" y="535" font-family="Arial" font-weight="600" font-size="16" fill="white" text-anchor="middle">⚡ Resultado na hora</text>

  <rect x="612" y="510" width="240" height="40" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="732" y="535" font-family="Arial" font-weight="600" font-size="16" fill="white" text-anchor="middle">📲 Via WhatsApp</text>

  <!-- Ícone foguete grande à direita -->
  <text x="870" y="420" font-family="Arial" font-size="200" text-anchor="middle">🚀</text>

  <!-- 3 áreas coloridas pequenas -->
  <rect x="820" y="460" width="120" height="6" rx="3" fill="#E67E22"/>
  <rect x="820" y="476" width="120" height="6" rx="3" fill="#27AE60"/>
  <rect x="820" y="492" width="120" height="6" rx="3" fill="#8E44AD"/>

  <text x="952" y="470" font-family="Arial" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">Área 1</text>
  <text x="952" y="486" font-family="Arial" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">Área 2</text>
  <text x="952" y="502" font-family="Arial" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">Área 3</text>

  <!-- URL do site -->
  <text x="1140" y="590" font-family="Arial" font-size="15" fill="rgba(255,255,255,0.45)" text-anchor="end">luciakratz-arch.github.io/UNIVERSOdeOPORTUNIDADES</text>
</svg>
